name: Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: freshgram:build

    steps:
      - name: Check API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "Repository secrets API_ID and API_HASH are required."
            exit 1
          fi

      - name: Free up some disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env
          docker tag ghcr.io/telegramdesktop/tdesktop/centos_env $IMAGE_TAG

      - name: Build
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_INSTALL_PREFIX="/usr" \
          -D TDESKTOP_API_ID=${{ secrets.API_ID }} \
          -D TDESKTOP_API_HASH=${{ secrets.API_HASH }}

      - name: Create archive
        run: |
          cd out/install
          tar -czf freshGram-linux-x86_64.tar.gz usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-linux-x86_64
          path: out/install/freshGram-linux-x86_64.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/install/freshGram-linux-x86_64.tar.gz
