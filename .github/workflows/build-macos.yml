name: Build macOS

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'Telegram/build/docker/centos_env/**'
      - '.github/workflows/build-env.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub release with this tag (for example v7.2.18), leave empty to only build
        type: string
        required: false

concurrency:
  group: build-macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Repository secrets API_ID and API_HASH are required, see docs/api_credentials.md."
            exit 1
          fi

      - name: Free up disk space
        run: |
          df -h /
          keep=$(readlink -f /Applications/Xcode.app || true)
          for xcode in /Applications/Xcode_*.app; do
            if [ "$(readlink -f "$xcode")" != "$keep" ]; then
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Android /Users/runner/Library/Android ~/.dotnet /usr/local/share/dotnet || true
          sudo rm -rf ~/hostedtoolcache /Users/runner/hostedtoolcache || true
          df -h /

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: freshGram
          submodules: recursive

      - name: Install tools
        run: |
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Restore libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-libraries-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}
          restore-keys: macos-libraries-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-

      - name: Prepare libraries
        id: prepare
        continue-on-error: true
        timeout-minutes: 300
        run: ./freshGram/Telegram/build/prepare/mac.sh silent

      - name: Save libraries
        if: always() && steps.libraries.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-libraries-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}

      - name: Stop when libraries are not ready
        if: steps.prepare.outcome != 'success'
        run: |
          echo "::error::Preparing the libraries did not finish in time. The finished part is cached, run the workflow again to continue."
          exit 1

      - name: Configure
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd freshGram/Telegram
          ./configure.sh \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        run: |
          cd freshGram
          for attempt in 1 2 3; do
            if cmake --build out --config Release --target Telegram; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed, trying again"
          done
          exit 1

      - name: Package
        run: |
          set -e
          app=$(find freshGram/out/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          mkdir -p dist dmg
          rm -rf dmg/freshGram.app
          cp -R "$app" dmg/freshGram.app
          codesign --force --deep --sign - dmg/freshGram.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname freshGram -srcfolder dmg -ov -format UDZO dist/freshGram.dmg
          (cd dist && shasum -a 256 freshGram.dmg > SHA256SUMS-macos)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-macos
          path: dist/
          retention-days: 7

      - name: Resolve release tag
        id: release
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: freshGram ${{ steps.release.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/freshGram.dmg
            dist/SHA256SUMS-macos
