name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'Telegram/build/docker/centos_env/**'
      - '.github/workflows/build-env.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub release with this tag (for example v7.2.10), leave empty to only build
        type: string
        required: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Repository secrets API_ID and API_HASH are required, see docs/api_credentials.md."
            exit 1
          fi

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build environment
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/freshgram-build-env:latest"
          if ! docker pull "$image"; then
            echo "::error::Build environment image is missing, run the 'Build environment' workflow first."
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Build
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mkdir -p "$CCACHE_DIR"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$CCACHE_DIR:/var/cache/ccache" \
            -e CONFIG=Release \
            -e KEEP_GOING=1 \
            -e CCACHE_MAXSIZE=3G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE" \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_INSTALL_PREFIX=/usr \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH"

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.run_id }}

      - name: Package
        run: |
          set -e
          binary=$(find out/Release -maxdepth 1 -type f -perm -u+x \( -iname 'freshgram' -o -iname 'telegram' \) | head -1)
          test -n "$binary"
          echo "Built $binary ($(stat -c %s "$binary") bytes)"
          mkdir -p dist
          cp "$binary" dist/freshGram
          tar -C out/install -czf dist/freshGram-linux-x86_64.tar.gz usr
          (cd dist && sha256sum freshGram freshGram-linux-x86_64.tar.gz > SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-linux-x86_64
          path: dist/
          retention-days: 7

      - name: Resolve release tag
        id: release
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: freshGram ${{ steps.release.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/freshGram-linux-x86_64.tar.gz
            dist/freshGram
            dist/SHA256SUMS
