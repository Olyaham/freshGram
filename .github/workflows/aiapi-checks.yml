name: AiApi adapter checks

on:
  push:
    paths:
      - '.gitattributes'
      - 'Telegram/ThirdParty/aiapi/**'
      - 'Telegram/ThirdParty/voice-asr/**'
      - 'tools/*voice_asr.py'
      - 'tools/sync_aiapi.py'
      - 'tools/tests/**'
      - 'Telegram/SourceFiles/ayu/features/recognition/**'
      - 'Telegram/SourceFiles/ayu/secret/secret_manager.cpp'
      - 'Telegram/SourceFiles/ayu/secret/secret_rekey.h'
      - 'Telegram/SourceFiles/ayu/secret/secret_crypto.*'
      - 'Telegram/SourceFiles/ayu/secret/secret_bridge.cpp'
      - 'Telegram/SourceFiles/boxes/translate_box*'
      - 'Telegram/SourceFiles/lang/translate_provider*'
      - 'Telegram/SourceFiles/history/view/history_view_translate_tracker.cpp'
      - 'Telegram/SourceFiles/test/secret/**'
      - 'Telegram/SourceFiles/test/recognition/**'
      - '.github/workflows/aiapi-checks.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'Telegram/ThirdParty/aiapi/**'
      - 'Telegram/ThirdParty/voice-asr/**'
      - 'tools/*voice_asr.py'
      - 'tools/sync_aiapi.py'
      - 'tools/tests/**'
      - 'Telegram/SourceFiles/ayu/features/recognition/**'
      - 'Telegram/SourceFiles/ayu/secret/secret_manager.cpp'
      - 'Telegram/SourceFiles/ayu/secret/secret_rekey.h'
      - 'Telegram/SourceFiles/ayu/secret/secret_crypto.*'
      - 'Telegram/SourceFiles/ayu/secret/secret_bridge.cpp'
      - 'Telegram/SourceFiles/boxes/translate_box*'
      - 'Telegram/SourceFiles/lang/translate_provider*'
      - 'Telegram/SourceFiles/history/view/history_view_translate_tracker.cpp'
      - 'Telegram/SourceFiles/test/secret/**'
      - 'Telegram/SourceFiles/test/recognition/**'
      - '.github/workflows/aiapi-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/sync_aiapi.py --check
      - run: python -m unittest discover -s tools/tests -p test_aiapi_snapshot.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libssl-dev pkg-config qt6-base-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Telegram/ThirdParty/aiapi
            Telegram/ThirdParty/voice-asr
      - name: Verify source snapshot
        run: python3 tools/sync_aiapi.py --check
      - name: Native routing and PFS regressions
        run: python3 -m unittest discover -s tools/tests -p test_native_policies.py
      - name: Secret key visualization and restart regressions
        run: python3 -m unittest discover -s tools/tests -p test_native_secret_visual.py
      - name: Secret request dialog regression
        run: python3 -m unittest tools.tests.test_secret_prompt -v
      - name: Secret translation consent regression
        run: python3 -m unittest tools.tests.test_secret_translation -v
      - name: Native audio and crash cleanup regressions
        run: python3 -m unittest discover -s tools/tests -p test_native_audio.py
      - name: Core checks
        working-directory: Telegram/ThirdParty/aiapi
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo doc --workspace --no-deps
      - name: Adapter checks
        working-directory: Telegram/ThirdParty/voice-asr
        run: |
          cargo fmt --all --check
          cargo test --all-targets --no-default-features --locked
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
          python3 tests/abi_smoke.py target/debug/deps/libvoice_asr.so
          cargo check --all-targets --features local --locked
      - name: Install module with inherited native flags
        env:
          CFLAGS: -O3 -pipe -fPIC -fno-omit-frame-pointer
          CXXFLAGS: -O3 -pipe -fPIC -fno-omit-frame-pointer
        run: |
          python3 tools/install_voice_asr.py --flavor cloud --profile dev \
            --build-dir "$GITHUB_WORKSPACE/Telegram/ThirdParty/voice-asr/target" \
            --destination "$RUNNER_TEMP/voice-asr-inherited-flags"
          python3 Telegram/ThirdParty/voice-asr/tests/abi_smoke.py \
            "$RUNNER_TEMP/voice-asr-inherited-flags/libvoice_asr.so"
      - name: Qt loader integration
        run: |
          cmake -S Telegram/SourceFiles/test/recognition -B "$RUNNER_TEMP/recognition-checks" \
            -D VOICE_ASR_TEST_LIBRARY="$GITHUB_WORKSPACE/Telegram/ThirdParty/voice-asr/target/debug/deps/libvoice_asr.so"
          cmake --build "$RUNNER_TEMP/recognition-checks" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/recognition-checks" --output-on-failure
